name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit, rule and AI tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Portable ZIP
        run: npm run package

      - name: AI-only campaign smoke run, the Reach (2 seeds, 15 years)
        run: npm run sim -- --scenario reach --seeds 1-2 --difficulty normal --years 15 --quiet --out reports/ci-ai-campaigns.md

      - name: AI-only campaign smoke run, Aldmere (1 seed, 10 years)
        run: npm run sim -- --scenario aldmere --seeds 1 --difficulty normal --years 10 --quiet --out reports/ci-ai-campaigns-aldmere.md

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Verify the web build (root, subpath, ZIP, iframe, touch, saves)
        run: npm run verify:web

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: crown-and-frontier-web
          path: |
            release/crown-and-frontier-web.zip
            release/crown-and-frontier-web.zip.sha256

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/web-verification.md
            reports/ci-ai-campaigns.md
            reports/ci-ai-campaigns-aldmere.md
